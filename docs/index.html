<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Dreamcamera</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #111111;
        color: #f7f2ea;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(92vw, 760px);
      }

      h1 {
        margin: 0 0 0.4rem;
        font-size: clamp(2.8rem, 8vw, 5.8rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      p {
        max-width: 42rem;
        color: #d8d1c4;
        font-size: 1.05rem;
      }

      a {
        color: #f3c766;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dreamcamera</h1>
      <p>GitHub Pages is ready. The live camera renderer is being built into this static app.</p>
      <p>
        <a href="https://github.com/baditaflorin/dreamcamera">GitHub</a>
        ·
        <a href="https://www.paypal.com/paypalme/florinbadita">PayPal</a>
      </p>
    </main>
  </body>
</html>
